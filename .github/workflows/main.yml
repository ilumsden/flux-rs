name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  merge_group:
    
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.rust }} on ${{ matrix.image }}-${{ matrix.flux_version }})
    runs-on: ubuntu-latest
    container:
      image: fluxrm/flux-core:${{ matrix.image }}-${{ matrix.flux_version }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88", "stable"]
        image: ["bookworm", "noble"]
        flux_version: ["v0.88.0", "v0.83.0-amd64", "v0.71.0-amd64"]

    steps:
      - uses: actions/checkout@v4
      
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
              curl \
              ca-certificates \
              build-essential

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "${{ matrix.image }}-${{ matrix.flux_version }}"

      - name: Type Check
        run: cargo check --all-targets --all-features

      - name: Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Unit Tests under Flux
        run: flux start cargo test --all-features
        
      - name: Run Broker Module/RPC Integration Test
        run: cargo xtask test-broker-rpc -r

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    container:
      image: fluxrm/flux-core:bookworm-v0.88.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
              curl \
              ca-certificates \
              build-essential

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bookworm-v0.88.0"

      - name: Generate Code Coverage under Flux
        run: |
            cargo xtask coverage

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: |
            lcov.info
            coverage-html/

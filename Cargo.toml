[package]
name = "flux-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
build = "build.rs"

[build-dependencies]
semver = "1.0"

[dependencies]
flux-sys = { git = "https://github.com/flux-framework/flux-sys-rs.git", branch = "master", version = "0.3.0", features = [
    "core",
    "idset",
    "hostlist",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitflags = { version = "2.8", features = ["serde"] }
libc = "0.2"
errno = "0.3"
thiserror = "2.0"
pastey = "0.2"
chrono = "0.4"
url = "2.5"
indexmap = "2.14.0"
nix = { version = "0.31", features = ["fs"] }
tokio = { version = "1.0", optional = true, features = [
    "net",
    "rt",
    "macros",
    "time",
] }
smol = { version = "2.0", optional = true }
async-io = { version = "2", optional = true }

[features]
default = []
tokio = ["dep:tokio"]
smol = ["dep:smol", "dep:async-io"]
# Enable the 'jobtap' feature on flux-sys when this crate's 'jobtap' feature is enabled
jobtap = ["flux-sys/jobtap"]

[package.metadata.llvm-cov]
ignore-filename-regex = ["src/**/tests/", "build\\.rs"]

[workspace]
members = [
    ".",
    "xtask",
    "tests/test_broker_module",
    # "tests/test_jobtap_plugin",
    "tests/test_rpc",
]
default-members = ["."]

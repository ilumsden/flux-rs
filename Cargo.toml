[package]
name = "flux-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitflags = { version = "2.8", features = ["serde"] }
flux-sys = { git = "https://github.com/ilumsden/flux-sys-rs.git", branch = "rust_2021_modernization", features = [
    "core",
    "idset",
    "hostlist",
] }
libc = "0.2"
errno = "0.3"
thiserror = "2.0"
paste = "1.0"
chrono = "0.4"
url = "2.5"
nix = { version = "0.31", features = ["fs"] }
tokio = { version = "1.0", optional = true, features = ["net", "rt"] }
smol = { version = "2.0", optional = true }
async-io = { version = "2", optional = true }

[features]
default = []
tokio = ["dep:tokio"]
smol = ["dep:smol", "dep:async-io"]

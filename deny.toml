[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # "RUSTSEC-2020-0001",  # example: ignore a specific advisory with justification
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "LGPL-3.0-only",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "flux-sys"
version = "0.3.0"
expression = "LGPL-3.0-only" # or "LGPL-3.0-or-later"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # { name = "openssl", reason = "use rustls instead" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/flux-framework/flux-sys-rs"]
